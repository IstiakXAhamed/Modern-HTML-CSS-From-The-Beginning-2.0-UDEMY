<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 1.3 - Simple Clock UI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Clock Container-->
    <div class="container">
      <div class="clock">
        <!-- Clock Hands (2 Hands: Blue Minute & Red Second) -->
        <div class="hand minute-hand"></div>
        <div class="hand second-hand"></div>

        <!-- Center Pivot Dot -->
        <div class="center-dot"></div>
      </div>
    </div>
  </body>
</html>
